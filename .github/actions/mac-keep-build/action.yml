name: Keep the build folder
description: >
  After a build that passed: puts .build into the cache under the key mac-setup worked out, for the jobs to come. Call it before anything
  else gets to write there, and only if mac-setup's `keep-build` says 'true'.

inputs:
  key:
    description: mac-setup's output `build-key`
    required: true

runs:
  using: composite
  steps:
    - name: Note what the build was made of
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: |
        "$GITHUB_ACTION_PATH/../../../scripts/ci-mtimes.py" record
        echo "::notice title=build cache::keeping $(du -sm .build | cut -f1) MB as $KEY"
    - name: Keep it
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build
        key: ${{ inputs.key }}
