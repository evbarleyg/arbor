name: Release

# Builds a release on GitHub's Mac and leaves it on the releases page as a DRAFT for a person to read and publish:
# the disk image, the zip, their checksums, the Homebrew cask, and notes from the top of CHANGELOG.md.
# It starts by hand and in no other way (Actions → Release → Run workflow, or `gh workflow run release.yml -f rehearsal=false`), on a branch
# or on a tag: v0.9.0 for the version in the VERSION file, v0.9.0-rc.1 for a release candidate of it. See "Making a
# release" in docs/INSTALL.md. Pushing a tag starts nothing: a tag marks a commit, and marking one must not take half an
# hour of a Mac or put anything on the releases page. Nor does a pull request: the one that
# carries a long-lived branch into main contains these files for as long as it is open, and would build at every push.
#
# The build is signed ad hoc and not notarized: that takes an Apple Developer ID, which the project does not have.
# The notes tell people how to get a downloaded copy past its first launch.
#
# "rehearsal" is ticked to begin with: all of it except sending anything to the releases page, for after a change to the release tooling.
# In a rehearsal no job holds a token that can write, and none reads a secret or a signing identity: there is nothing to send with.
# Whoever makes a release unticks it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 0.9.0-rc.1 (empty means the VERSION file)
        required: false
        default: ""
        type: string
      draft:
        description: Leave the release as a draft
        required: false
        default: true
        type: boolean
      # Ticked unless somebody unticks it: a run that says nothing, or whose inputs were lost on the way, sends nothing.
      rehearsal:
        description: Build everything, send nothing to the releases page (untick to make the release)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the number of commits
          persist-credentials: false

      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          ./scripts/ci-toolchain.sh
          export PATH="$HOME/.swiftly/bin:$PATH"

      # Inputs and ref names reach the shell only through the environment, and version.sh checks the result.
      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          file=$(./scripts/version.sh version)
          version=$file
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; fi
          if [ -n "$INPUT_VERSION" ]; then version=${INPUT_VERSION#v}; fi
          case "$version" in
            "$file" | "$file"-*) ;;
            *)
              echo "::error::$version is neither $file, the version in the VERSION file, nor a pre-release of it. Change VERSION first."
              exit 1;;
          esac
          echo "::notice title=version::$(ARBOR_VERSION=$version ./scripts/version.sh)"
          echo "ARBOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check
        run: ./scripts/ci-step.py --summary 'Test run with|passed|failed' --report .build/test-report.jsonl check make check

      - name: Build the release
        run: ./scripts/ci-step.py release make release

      - name: Hand the files on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arbor-release
          path: |
            build/Arbor-*
            build/arbor.rb
          if-no-files-found: error

  # In a rehearsal, in place of `publish`: the same files and the same script, told to send nothing, in a job whose token can write nothing.
  rehearse-publish:
    if: ${{ inputs.rehearsal }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARBOR_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arbor-release
          path: build

      - name: Say what would be sent, and send nothing
        run: ./scripts/ci-step.py publish ./scripts/publish-release.sh --dry-run

  # On Linux, and apart from the build, which therefore never holds a token that can write. The one job here that does, and it does not
  # start in a rehearsal: a condition on its last step would leave the job running with its token. scripts/lint-workflows.py holds the
  # whole file to that ("a rehearsal sends nothing"), and wants the condition in these very words.
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal == false }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release; nothing else is written
    env:
      ARBOR_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arbor-release
          path: build

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub takes a missing input to equal false, so an event without inputs would publish at once: hence the
          # first condition, should anyone add another trigger.
          ARBOR_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == false && 'false' || 'true' }}
        run: ./scripts/ci-step.py publish ./scripts/publish-release.sh
