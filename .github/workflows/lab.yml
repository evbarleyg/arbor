name: Lab

# Throwaway: one self-test under the runner's own git.
on:
  push:
    branches: ['lab/**']

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: git --version
      - run: ./scripts/ci-step.py public-check ./scripts/test-public-check.py
      - run: ./scripts/ci-step.py lint make lint
