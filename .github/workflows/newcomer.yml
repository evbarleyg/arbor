name: Newcomer
run-name: "Newcomer: ${{ github.ref_name }}"

# The newcomer's eval (scripts/newcomer/README.md): a hosted Mac that somebody who knows nothing about Arbor sees only in pictures and
# touches only with real keys, clicks and drags, one act at a time, through two branches of this repository. It is scored
# against the same tasks played with macOS alone.
#
# Started by a push to newcomer-start/<run> (scripts/newcomer/start.sh), which costs no call to GitHub's API and works from a branch
# that has not landed: a push runs the workflow of the commit that is pushed. Only who may push here can start it, and only
# who may push here can tell the Mac what to do. What is asked for stands in the commit's subject and is checked letter by letter.
#
# One at a time: there are five Macs for everybody, and this one is held for up to two hours.

on:
  push:
    branches: ["newcomer-start/*"]

concurrency:
  group: newcomer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write # to push mac-shell-out/newcomer.<run>.screen and .record, and to delete newcomer-start/<run>; nothing else is written
    steps:
      - name: Check what was asked for
        id: asked
        env:
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -f
          name=${BRANCH#newcomer-start/}
          [[ "$name" =~ ^[A-Za-z0-9-]{1,20}$ ]] || { echo "::error::a run's name is 1 to 20 letters, digits and dashes"; exit 2; }
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          arm="" build="" mark=yes
          case "$subject" in "newcomer: "*) ;; *) echo "::error::the commit's subject begins 'newcomer: ' (scripts/newcomer/start.sh writes it)"; exit 2 ;; esac
          for word in ${subject#newcomer: }; do
            case "$word" in
              arm=arbor | arm=macos) arm=${word#arm=} ;;
              mark=yes | mark=no) mark=${word#mark=} ;;
              build=*) build=${word#build=} ;;
              *) echo "::error::arm=arbor|macos, build=<commit or branch>, mark=yes|no, and nothing else"; exit 2 ;;
            esac
          done
          [ -n "$arm" ] || { echo "::error::arm=arbor or arm=macos"; exit 2; }
          if [ "$arm" = arbor ]; then
            case "$build" in
              "" | /* | -* | *..* | *[!A-Za-z0-9._/-]* | refs/pull/* | pull/*) echo "::error::build= takes a commit or a branch of this repository"; exit 2 ;;
            esac
          fi
          {
            echo "run=$name"
            echo "arm=$arm"
            echo "build=$build"
            echo "mark=$mark"
            # Ten minutes short of the job's own limit: whatever happens, what was seen comes back.
            echo "until=$(($(date +%s) + 6600))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing on this Mac but the courier gets a token

      # As root, from a copy that is root's, with the token on its standard input: see the header of courier.sh. It outlives this step and ends with the last.
      # Before anything that can fail, so that whatever happens somebody is there to take the branch that started the run away.
      - name: The courier
        env:
          TOKEN: ${{ github.token }}
          NAME: ${{ steps.asked.outputs.run }}
        run: |
          # GitHub keeps the token itself out of its logs, and this form of it only when told.
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          mkdir -p "$RUNNER_TEMP/box"
          sudo install -o root -m 700 scripts/newcomer/courier.sh /var/root/newcomer-courier.sh
          token=$TOKEN
          unset TOKEN # or sudo, which stays for as long as the courier does, would have it in its environment
          printf '%s\n' "$token" | sudo nohup bash /var/root/newcomer-courier.sh "$RUNNER_TEMP/box" "https://github.com/$GITHUB_REPOSITORY.git" "$NAME" \
            > "$RUNNER_TEMP/courier.log" 2>&1 &
          sleep 1
          pgrep -f newcomer-courier.sh > /dev/null || { cat "$RUNNER_TEMP/courier.log"; echo "::error::the courier did not start"; exit 1; }

      - name: The Arbor under test
        if: steps.asked.outputs.arm == 'arbor'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.asked.outputs.build }}
          path: product
          fetch-depth: 0 # the build's number is the number of commits that lead to it
          persist-credentials: false
      # GitHub hands out the commits of forks and of strangers' pull requests under this repository's name to whoever knows their ids. What is built and started here
      # runs beside a token, on a Mac whose pictures are published: it has to be the work of somebody who may push here.
      - name: It is on a branch of this repository
        if: steps.asked.outputs.arm == 'arbor'
        run: |
          echo product >> .git/info/exclude
          [ -n "$(git -C product branch --remotes --contains HEAD)" ] || { echo "::error::that commit is on no branch of this repository"; exit 2; }

      - name: Set up
        uses: ./.github/actions/mac-setup
        with:
          # Without Arbor only the tools are compiled, and the runner's own compiler will do.
          swift: ${{ steps.asked.outputs.arm == 'arbor' && '6.4' || '' }}

      # What a stranger gets: an app somebody else has built, zipped. There is no release to download it from, so it is built here.
      - name: Build it, as a release is built
        if: steps.asked.outputs.arm == 'arbor'
        timeout-minutes: 20
        working-directory: product
        run: |
          swift --version
          make app || ARBOR_CONFIGURATION=debug make app
          ditto -c -k --keepParent build/Arbor.app "$RUNNER_TEMP/Arbor.zip"
          ls -l "$RUNNER_TEMP/Arbor.zip"
          {
            echo "NEWCOMER_CDHASH=$(codesign --display --verbose=3 build/Arbor.app 2>&1 | sed -n 's/^CDHash=//p')"
            echo "NEWCOMER_BUILD=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          cp README.md "$RUNNER_TEMP/README-of-the-build.md"
      # A stranger has the app and not its source, which would otherwise lie a few clicks away in Finder.
      - name: The source goes
        if: steps.asked.outputs.arm == 'arbor'
        run: rm -rf product

      - name: The newcomer's hours
        timeout-minutes: 116
        env:
          NEWCOMER_RUN: ${{ steps.asked.outputs.run }}
          NEWCOMER_ARM: ${{ steps.asked.outputs.arm }}
          NEWCOMER_MARK: ${{ steps.asked.outputs.mark }}
          NEWCOMER_UNTIL: ${{ steps.asked.outputs.until }}
        run: |
          export NEWCOMER_BOX="$RUNNER_TEMP/box" NEWCOMER_ZIP="$RUNNER_TEMP/Arbor.zip" NEWCOMER_README="$RUNNER_TEMP/README-of-the-build.md"
          # The loop ends by itself when its time is up; this is for a loop that does not.
          export MAC_SHELL_LIMIT=$((NEWCOMER_UNTIL - $(date +%s) + 240)) ARBOR_TIME_LIMIT=$((NEWCOMER_UNTIL - $(date +%s) + 200))
          scripts/ci-mac-shell.sh scripts/mac-shell/newcomer.sh

      # All of it, where the journal alone has gone out so far; and the branch that started the run has done its work. The courier's last errands: no step after
      # the first hands anybody a token, least of all after two hours in which this Mac did what it was told from afar.
      - name: The record goes out, and the courier goes home
        if: always() && steps.asked.outcome == 'success'
        run: |
          box="$RUNNER_TEMP/box"
          [ -d "$box" ] || exit 0
          ask() {
            echo "$1 $2" > "$box/request.new" && mv "$box/request.new" "$box/request"
            for _ in $(seq 1 240); do [ -f "$box/answer-$1" ] && break; sleep 0.5; done
            echo "$2: $(cat "$box/answer-$1" 2>/dev/null || echo "no answer")"
          }
          if [ -d mac-shell ]; then
            gzip -9 mac-shell/samples.log mac-shell/witness.log 2>/dev/null || true
            find mac-shell -type f -size +20M -print -delete | sed 's/^/::warning::left out, over 20 MB: /'
            # The journal that is there already is the whole one unless the loop handed over its own.
            cp -R mac-shell/. "$box/record/"
          fi
          echo "::notice title=newcomer::the record: $(find "$box/record" -type f | wc -l | tr -d ' ') files, $(du -sm "$box/record" | cut -f 1) MB"
          if [ -d "$box/screen" ] && [ ! -f "$box/screen/over" ]; then
            # Cut off before the loop could say goodbye: or the newcomer would wait two minutes at every word, for a Mac that has gone.
            echo over > "$box/screen/over"
            echo 99999 > "$box/screen/round"
            echo 0 > "$box/screen/answers"
            echo "This Mac has gone: its time was up, or it was called away." > "$box/screen/status.txt"
            ask 1000000 screen
          fi
          ask 1000001 record
          ask 1000002 goodbye
          touch "$box/stop"
          for _ in $(seq 1 60); do pgrep -f newcomer-courier.sh > /dev/null || break; sleep 0.5; done
          cat "$RUNNER_TEMP/courier.log" || true
