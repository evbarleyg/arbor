name: Public check

# Whatever is pushed here is public at once and for good, pull request or not. So every push and every pull request is read
# for what should have stayed private (scripts/public-check.py says what that is), on Linux, in seconds. The same check
# runs before the push in every clone where `make hooks` has been said; this run is for the others.
#
# It only reads: no token that can write, and none left behind for the code it checks out.

on:
  push:
    # All but what workflows write: the output of Mac shell runs, one commit each with no history, and how things stand here.
    branches-ignore: ["mac-shell-out/**", "state/**"]
    tags: ["**"]
  pull_request:

# A newer push makes the run for the older one worthless, except on main: there each run reads only what its own push added, so each
# must finish. The trunk is pushed once for every pull request that lands, twenty times in four minutes: it is read whole each time (below).
concurrency:
  group: public-check-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'newest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-check:
    # A pull request from a branch of this repository: the run for the push has read that branch, whole. A second run would take a runner to read
    # less. One from a fork has no other.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # the newest number, to tell a reference to something here from one to nothing
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as its author pushed it, not GitHub's trial merge of it, and with all of its history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Nothing private in what this adds
        env:
          GH_TOKEN: ${{ github.token }}
          # A pull request is held against its base, and a push to main against what was there before; what main or the trunk has besides
          # was read on its way there, and the check leaves it out (read_elsewhere). The trunk is held against nothing, as if pushed anew:
          # all that main does not hold is read, seventeen seconds for six hundred commits, so a run that made way for a newer one left nothing unread.
          # Any other branch is read whole at every push: it stays red until its history is clean.
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || (github.ref == 'refs/heads/swarm/trunk' && '0000000000000000000000000000000000000000') || '' }}
          BRANCH: ${{ github.ref_type != 'tag' && (github.head_ref || github.ref_name) || '' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          check=scripts/public-check.py
          if [ ! -f "$check" ]; then
            # Such a branch is as public as any other: it is read with the trunk's check.
            mkdir "$RUNNER_TEMP/check"
            for name in public-check.py public-check.allow; do git show "origin/swarm/trunk:scripts/$name" > "$RUNNER_TEMP/check/$name"; done
            check=$RUNNER_TEMP/check/public-check.py
          fi
          python3 "$check" ${BASE:+--base "$BASE"} ${BRANCH:+--branch "$BRANCH"} ${TAG:+--tag "$TAG"}
      # The step above reads what is new. This one holds the sum to the same: two changes that are each clean, an exception that was
      # taken away, a rule that learnt something. Only where work is integrated: a branch from before the tree read clean would stay red.
      - name: Nothing private in the whole tree
        if: ${{ !cancelled() && github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/swarm/trunk"]'), github.ref) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/public-check.py --tree
      # The reading comes first, and whatever becomes of one step the others still run: a test of the check that trips over the runner's git once
      # kept the check itself from reading anything, on every branch, for half an hour.
      # What follows tries the tools, not the push: a minute of the runner where the reading takes seconds, and the same every time unless the push
      # touches them. Hundreds of runs a day waited for one another to say it again. Where it cannot be told what the push touches, they run.
      - name: Does this touch the tools that are tried below?
        id: tools
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || (github.ref == 'refs/heads/swarm/trunk' && '0000000000000000000000000000000000000000') || '' }}
        run: |
          since=${BASE:-$(git merge-base origin/swarm/trunk HEAD || true)}
          if [ -n "$since" ] && git diff --quiet "$since" HEAD -- .github scripts/public-check.py scripts/public-check.allow scripts/test-public-check.py \
            scripts/side_by_side.py scripts/git-hooks scripts/housekeeping.py scripts/lint-workflows.py
          then echo "touched=no"; else echo "touched=yes"; fi | tee -a "$GITHUB_OUTPUT"
      # (A pull request takes this file from its trial merge with the base, and the branch itself may be from before there was a check.)
      - name: The check finds what it should, and leaves alone what it should
        if: ${{ !cancelled() && steps.tools.outputs.touched != 'no' }}
        run: if [ -f scripts/test-public-check.py ]; then ./scripts/test-public-check.py; else echo "this branch is from before the check"; fi
      - name: So does the daily pruning of branches
        if: ${{ !cancelled() && steps.tools.outputs.touched != 'no' }}
        run: if [ -f scripts/housekeeping.py ]; then ./scripts/housekeeping.py --self-test; fi
      - name: Every action is the commit its version names, going by the action's own repository
        if: ${{ !cancelled() && steps.tools.outputs.touched != 'no' }}
        run: if [ -f scripts/lint-workflows.py ]; then ./scripts/lint-workflows.py --verify; fi
