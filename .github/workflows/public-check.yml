name: Public check

# Whatever is pushed here is public at once and for good, pull request or not. So every push and every pull request is read
# for what should have stayed private (scripts/public-check.py says what that is), on Linux, in seconds. The same check
# runs before the push in every clone where `make hooks` has been said; this run is for the others.
#
# It only reads: no token that can write, and none left behind for the code it checks out.

on:
  push:
    # All but the output of Mac shell runs: one commit each, with no history, made by a workflow.
    branches-ignore: ["mac-shell-out/**"]
    tags: ["**"]
  pull_request:

# A newer push makes the run for the older one worthless, except where work is integrated: there each run reads only what
# its own push added, so each must finish.
concurrency:
  group: public-check-${{ github.event_name }}-${{ github.ref }}-${{ contains(fromJSON('["refs/heads/main", "refs/heads/swarm/trunk"]'), github.ref) && github.sha || 'newest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # the newest number, to tell a reference to something here from one to nothing
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The branch as its author pushed it, not GitHub's trial merge of it, and with all of its history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A pull request takes this file from its trial merge with the base, and the branch itself may be from before there was a check.
      - name: The check finds what it should, and leaves alone what it should
        run: if [ -f scripts/test-public-check.py ]; then ./scripts/test-public-check.py; else echo "this branch is from before the check"; fi
      - name: Nothing private in what this adds
        env:
          GH_TOKEN: ${{ github.token }}
          # A pull request is held against its base, and a push to a branch where work is integrated against what was there
          # before. Any other branch is read whole at every push: it stays red until its history is clean.
          BASE: ${{ github.event.pull_request.base.sha || (contains(fromJSON('["refs/heads/main", "refs/heads/swarm/trunk"]'), github.ref) && github.event.before) || '' }}
          BRANCH: ${{ github.ref_type != 'tag' && (github.head_ref || github.ref_name) || '' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          check=scripts/public-check.py
          if [ ! -f "$check" ]; then
            # Such a branch is as public as any other: it is read with the trunk's check.
            mkdir "$RUNNER_TEMP/check"
            for name in public-check.py public-check.allow; do git show "origin/swarm/trunk:scripts/$name" > "$RUNNER_TEMP/check/$name"; done
            check=$RUNNER_TEMP/check/public-check.py
          fi
          python3 "$check" ${BASE:+--base "$BASE"} ${BRANCH:+--branch "$BRANCH"} ${TAG:+--tag "$TAG"}
