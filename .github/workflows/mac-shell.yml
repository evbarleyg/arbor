name: Mac shell
run-name: "Mac shell${{ inputs.runner != 'macos-26' && format(' ({0})', inputs.runner) || '' }}: ${{ inputs.script }} at ${{ inputs.ref || github.ref_name }}${{ inputs.unchecked && format(' (no pre-flight: {0})', inputs.unchecked) || '' }} [${{ inputs.tag || github.run_id }}]"

# A remote Mac for executors that have none. Checks out a ref, runs one script
# from that ref, or several one after the other, on GitHub's macOS runner with
# the newest Xcode selected, and pushes everything they left in mac-shell/ (output,
# screenshots, logs) to the throwaway branch mac-shell-out/<tag>, where `git fetch`
# reaches it. Start it with scripts/mac-shell/run.sh, which also waits, fetches the
# output and deletes the branch.
#
# Only repository writers can start it (workflow_dispatch), and a script is
# a file in the repository, never free text, so nobody can run arbitrary
# commands by filling in a form. The scripts never see the token that pushes.
# See docs/TESTING.md, "Seeing the real app from anywhere".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check out (empty means the ref the workflow runs from)
        required: false
        default: ""
        type: string
      script:
        description: Path of a script inside the repository at that ref, e.g. scripts/mac-shell/e2e.sh; or several, with spaces between them
        required: true
        type: string
      macs:
        description: 'For more than one Mac: a JSON list with the scripts for each, e.g. ["a.sh b.sh", "c.sh"] (run.sh --macs writes it)'
        required: false
        default: ""
        type: string
      tag:
        description: The output goes to the branch mac-shell-out/<tag> (letters, digits, . _ -; empty means the run id); of several Macs to <tag>.1, <tag>.2, …
        required: false
        default: ""
        type: string
      runner:
        description: Which of GitHub's Macs. Arbor claims macOS 14 and later; all of these count towards the same five at a time
        required: false
        default: macos-26
        type: choice
        # A list, so that nothing but a hosted Mac of the ordinary kind can ever be named here.
        options: [macos-26, macos-15, macos-14, macos-15-intel]
      unchecked:
        description: Why the run was started without the pre-flight on Linux (run.sh --no-preflight); only shown, in the run's title
        required: false
        default: ""
        type: string
      bare:
        description: No toolchain and no build, for a script that only asks the Mac something
        required: false
        default: false
        type: boolean

# A run started again under the same tag (by default: the same scripts for the same branch) replaces the one before, which would
# push to the same branch anyway: whoever starts it again after a fix no longer wants the old answer, and somebody is waiting for that Mac.
concurrency:
  group: mac-shell-${{ inputs.tag || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # Each script has twenty minutes (scripts/ci-mac-shell.sh); this is for a Mac on which nothing moves any more.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scripts: ${{ fromJSON(inputs.macs || format('["{0}"]', inputs.script)) }}
    permissions:
      contents: write # to push mac-shell-out/<tag>; nothing else is written
    env:
      SCRIPT: ${{ matrix.scripts }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          TAG: ${{ inputs.tag || github.run_id }}
          ALL: ${{ inputs.script }}
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -f # a star in there is a mistake, not a pattern
          [ -n "$SCRIPT" ] || { echo "::error::no script"; exit 2; }
          [ "$(echo $SCRIPT | wc -w)" -le 4 ] || { echo "::error::at most four scripts for one Mac: give the rest to another (run.sh --macs)"; exit 2; }
          for script in $SCRIPT; do
            case "$script" in
              /*|-*|*..*|*[!A-Za-z0-9._/-]*)
                echo "::error::a script must be a relative path inside the repository, got '$script'"
                exit 2;;
            esac
          done
          # What is built here is kept for everybody's runs, so it has to be the work of somebody who may push here.
          case "$REF" in
            refs/pull/*|pull/*)
              echo "::error::not a pull request's ref: push the branch to this repository first"
              exit 2;;
          esac
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || ! git check-ref-format "refs/heads/mac-shell-out/$TAG"; then
            echo "::error::tag must be 1 to 40 letters, digits, dots, underscores or dashes, and a valid branch name"
            exit 2
          fi
          if [ "$TOTAL" -gt 1 ]; then TAG=$TAG.$((INDEX + 1)); fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # For a script that is given to several Macs and shares its work out among them: "2/3" on the second of three.
          echo "MAC_SHELL_SHARE=$((INDEX + 1))/$TOTAL" >> "$GITHUB_ENV"
          # How many playings the whole dispatch has (scripts/ci-mac-shell.sh): all its scripts, or of one script as many as there are Macs.
          parts=$(echo $ALL | wc -w | tr -d ' ')
          if [ "$parts" -le 1 ]; then parts=$TOTAL; fi
          echo "MAC_SHELL_PARTS=$parts" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false # the script gets no token

      # The set-up belongs to the workflow, not to the commit under test, which may be older than any of it. run.sh starts the
      # workflow from one and the same branch for everybody, because a cache can be read only from the branch that wrote it (and from
      # main): so all runs share one toolchain and one another's builds.
      - name: The workflow's own tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Which Git need not see
        run: echo .ci >> .git/info/exclude
      - name: Set up
        id: setup
        if: ${{ !inputs.bare }}
        uses: ./.ci/.github/actions/mac-setup
        with:
          build-cache: products
      # Here, so that what is kept is a build and nothing else. A build that fails is the script's to report, as it always was.
      - name: Build
        id: build
        if: ${{ !inputs.bare }}
        run: |
          swift --version
          .ci/scripts/ci-build.sh && echo "passed=true" >> "$GITHUB_OUTPUT" || echo "::warning::swift build failed"
      - name: Keep the build
        if: steps.build.outputs.passed == 'true' && steps.setup.outputs.keep-build == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.ci/.github/actions/mac-keep-build
        with:
          key: ${{ steps.setup.outputs.build-key }}

      - name: Run the scripts from the repository
        # Shorter than the job's limit, so that whatever happens the output gets pushed.
        timeout-minutes: 90
        run: |
          set -f
          .ci/scripts/ci-mac-shell.sh $SCRIPT

      # An orphan commit holding only the output. CI runs on pushes to main and on pull requests, and
      # pushes made with GITHUB_TOKEN start no workflows at all, so this branch never starts a run.
      - name: Push the output to mac-shell-out/<tag>
        if: always() && steps.inputs.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -d mac-shell ] || [ -z "$(ls -A mac-shell)" ]; then
            echo "::warning::nothing was left in mac-shell/, so there is no output branch"
            exit 0
          fi
          commit=$(git rev-parse --short HEAD)
          out=$(mktemp -d)
          cp -R mac-shell/. "$out/"
          cd "$out"
          # GitHub refuses files over 100 MB, and one of those must not cost the rest of the output.
          find . -type f -size +50m -print -delete | sed 's/^/::warning::left out, over 50 MB: /'
          git init --quiet --initial-branch=out
          git add --all
          git -c user.name="mac-shell" -c user.email="mac-shell@users.noreply.github.com" \
            commit --quiet --message "mac-shell: output of $SCRIPT at $commit (run $GITHUB_RUN_ID)"
          # The token travels in the environment, not on a command line or in a file.
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git push --quiet --force "https://github.com/$GITHUB_REPOSITORY.git" "out:refs/heads/mac-shell-out/$TAG"
          echo "::notice title=mac-shell output branch::mac-shell-out/$TAG ($(git ls-files | wc -l | tr -d ' ') files)"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-shell-output${{ strategy.job-total > 1 && format('-{0}', env.TAG) || '' }}
          path: mac-shell/
          if-no-files-found: warn
