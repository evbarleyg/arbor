name: State

# How things stand here (open pull requests and their checks, who has a Mac and who waits for one), asked by ONE poller for
# everybody and put on the branch `state/github` every two or three minutes (scripts/gh-state.py says why). Whoever wants to know
# fetches that branch, which no limit counts, instead of asking GitHub's API, which allows an account so many requests an hour.
#
# It ran in somebody's working session before, where a job lives two hours and has to be handed on. Nobody has to remember this one:
# a run begins every hour and goes on for a good hour; the next one takes over by ending it. GitHub starts scheduled runs late when it is
# busy, hence the overlap. On a free hosted Linux runner.
#
# The token may push, so: only the schedule and a hand can start it, both take this file and the script from the default branch, and
# nothing anybody posted or pushed is run or written into a command. What it reads is public already.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: true

permissions: {}

jobs:
  state:
    # Not in a fork, whose owner has not asked for a branch that is rewritten all day.
    if: github.repository == 'evbarleyg/arbor'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write # the branch it writes
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # With the first commit, which what is published hangs on. The token stays for the pushes.
          fetch-depth: 0
      - name: Ask, write, publish; again and again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/state"
          python3 scripts/gh-state.py --out "$RUNNER_TEMP/state/github-state.md" --queue "$RUNNER_TEMP/state/mac-queue-cache.json" \
            --cache "$RUNNER_TEMP/state/cache.json" --every 150 --for 90 --publish state/github
