name: CI

on:
  push:
    # A merge train: the trunk with a batch of pull requests on it, pushed as `train/…` by whoever lands them, with no pull request of
    # its own. All of this runs on the sum, which is what will be the trunk: two pull requests that are each green can be red
    # together. Green, and the trunk moves forward to that very commit; that push starts no run of this workflow (an open pull
    # request from the trunk into main gets one, as at every push to the trunk, and no Mac: this commit has passed on one).
    # To scripts/ci-changes.py a train is a push like one to main: work is integrated here.
    branches: [main, "train/**"]
  pull_request:
    # The last of them: a draft gets lint alone (see the job `linux`), and all the rest when its author marks it ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
  # Every test on a Mac, built from nothing, once a night on main: the backstop for all that the other runs leave to Linux and to caches.
  # At an hour when few people want a Mac.
  schedule:
    - cron: "17 10 * * *"
  # The same by hand, on any branch.
  workflow_dispatch:

# A newer push makes the run for the older one worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A hosted Mac is the slower and scarcer machine: GitHub lends the repository five at a time, for everybody's runs together.
# Hence one macOS job, which sets up once and builds once; none at all when it could prove nothing new; and on it only what a Mac can
# tell: the tests Linux cannot run or might answer differently, and real windows. scripts/ci-changes.py has the rules ("[mac]" in the
# head commit's subject asks for the Mac regardless, "[mac-full]" for every test on it). Nothing is dropped silently: `tests-accounted-for`
# fails if a test ran neither here nor there, and its summary says what ran where.
#
# Steps run through scripts/ci-step.py, which publishes test counts, the parity score and whatever
# failed as check annotations, for executors that cannot download logs.
jobs:
  changes:
    # By its number: if this job ever failed on a new system that `latest` had moved to, every run would take a Mac, by design.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      mac: ${{ steps.decide.outputs.mac }}
      tests: ${{ steps.decide.outputs.tests }}
      build: ${{ steps.decide.outputs.build }}
      why: ${{ steps.decide.outputs.why }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The rules, and what they read off which scripts the macOS job can reach.
          sparse-checkout: |
            scripts
            .github
            Tests
      - name: Does this run need a Mac?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-changes.py

  # The app, the real Accessibility and AppKit code, the tests a Mac can say something about, and real windows.
  #
  # With the Swift that comes with the runner's Xcode: what a person who clones Arbor has, and no time is spent
  # installing it. The other releases Arbor promises to build with have `oldest-swift` and `macos-other-swifts`.
  macos:
    needs: changes
    # Only an explicit "false" saves the Mac: it also runs when `changes` itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.mac != 'false' }}
    runs-on: macos-26
    # Every test takes thirteen minutes on a hosted Mac, and a build from nothing five.
    timeout-minutes: 45
    outputs:
      real-windows: ${{ steps.verdict.outputs.real-windows }}
      said: ${{ steps.verdict.outputs.said }}
    env:
      # Anything but these two words means the most: every test, built from nothing.
      TESTS: ${{ needs.changes.outputs.tests == 'mac-only' && 'mac-only' || 'full' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Compiling all the test files took longer than running the ones this job runs. For every step: it is part of the manifest's answer.
      - name: Which test files are compiled
        run: ./scripts/ci-tests.py sources --mode "$TESTS" >> "$GITHUB_ENV"
      - name: Set up
        id: setup
        uses: ./.github/actions/mac-setup
        with:
          swift: ""
          build-cache: ${{ needs.changes.outputs.build == 'upon' && 'tests' || 'none' }}
      - name: Toolchain
        run: ./scripts/ci-step.py toolchain swift --version
      - name: Build
        id: build
        run: |
          build() { ./scripts/ci-step.py --summary 'warning:|Build complete' build ./scripts/ci-build.sh --build-tests; }
          build && exit 0
          [ -n "${!ARBOR_TEST_SOURCES_*}" ] || exit 1
          # The list is read off the sources, and a file too few on it must cost minutes, not the verdict. If the fault is in the code it fails again.
          echo "::warning title=build::it does not compile with the selected test files alone (scripts/ci-tests.py sources): now with all of them"
          for name in ${!ARBOR_TEST_SOURCES_*}; do
            echo "$name=" >> "$GITHUB_ENV"
            unset "$name"
          done
          echo "whole=true" >> "$GITHUB_OUTPUT"
          build
      - name: Keep the build
        # Not under the name of a build it is not.
        if: steps.setup.outputs.keep-build == 'true' && steps.build.outputs.whole != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/mac-keep-build
        with:
          key: ${{ steps.setup.outputs.build-key }}
      # Real windows and the real pointer, on the same Mac and the same build. Whether Arbor builds and passes its tests, and whether it does on
      # real windows what the tests say, are two questions, and each still gets its own answer: these two steps do not fail this job, and
      # the job `real-windows` below passes on what they said.
      #
      # First, on a Mac on which nothing but a build has happened. After the tests and the rest, a quarter of an hour into the job, Arbor saw
      # no drag at all (11 of 18 checks of e2e-drag.sh, twice: whenever these steps came last, and never when they had a Mac of their own).
      #
      # GitHub's macOS runners grant Accessibility to the runner's processes (probe P3,
      # 2026-10-14), so arbor-e2e can move its test windows there. The fresh evidence comes back as an artifact (or through
      # scripts/mac-shell/run.sh scripts/mac-shell/e2e.sh); commit it as
      # collab/evidence/e2e-latest.txt when `make parity` should count it.
      - name: Real-window test
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f collab/evidence/e2e-latest.txt  # only a file this run wrote may be uploaded
          set -o pipefail
          ./scripts/ci-step.py e2e ./scripts/e2e.sh --full-screen | tee e2e.out
      # Nobody is using this Mac's pointer, so the drags a person would make can be made for real (F17, H4).
      - name: Real-pointer test
        id: drag
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/ci-step.py e2e-drag ./scripts/mac-shell/e2e-drag.sh | tee e2e-drag.out
      - name: Test
        run: >
          ./scripts/ci-step.py --summary '^Recorded [0-9]|^Running the tests of' --report mac.tsv.events test
          ./scripts/ci-tests.py run --mode "$TESTS" --record mac.tsv --all mac-all.txt
      - name: Hand on what ran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-mac
          path: |
            mac.tsv
            mac-all.txt
          if-no-files-found: warn
      - name: Simulator smoke test
        run: ./scripts/ci-step.py smoke ./scripts/sim-smoke.sh
      - name: User-journey scenarios
        run: ./scripts/ci-step.py scenarios ./scripts/scenarios.sh
      - name: Release tooling
        run: ./scripts/ci-step.py --summary '✘|release tools test' release-tools ./scripts/release-tools-test.sh
      # It wants the log of every test. Linux has one wherever there is a verdict, and checks the same.
      - name: Parity (no shipped feature may break; FEATURES.md must be current)
        if: env.TESTS == 'full'
        run: ./scripts/ci-step.py parity python3 scripts/parity.py --report mac.tsv.events --check

      - name: What real windows said
        id: verdict
        if: ${{ !cancelled() }}
        env:
          E2E: ${{ steps.e2e.outcome }}
          DRAG: ${{ steps.drag.outcome }}
        run: |
          echo "real-windows=e2e $E2E, e2e-drag $DRAG" >> "$GITHUB_OUTPUT"
          # The annotations of the two steps, for the job that gives the verdict to show as its own.
          { echo "said<<END-OF-WHAT-WAS-SAID"; cat e2e.out e2e-drag.out 2>/dev/null | grep -E '^::(error|notice) ' | cut -c 1-4000 | head -n 24; echo "END-OF-WHAT-WAS-SAID"; } >> "$GITHUB_OUTPUT"
      - name: Keep the evidence
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: collab/evidence/e2e-latest.txt
          if-no-files-found: warn

  # The second answer. No Mac: it says what the Mac job's two steps on real windows said, and shows their annotations as its own.
  real-windows:
    needs: macos
    if: ${{ !cancelled() && needs.macos.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: What real windows said
        env:
          VERDICT: ${{ needs.macos.outputs.real-windows }}
          SAID: ${{ needs.macos.outputs.said }}
        run: |
          printf '%s\n' "$SAID"
          case "$VERDICT" in
            "e2e success, e2e-drag success") echo "::notice title=real windows::$VERDICT" ;;
            # Also when the Mac job never got that far, and said nothing.
            *) echo "::error title=real windows::${VERDICT:-the Mac job did not get to them}"; exit 1 ;;
          esac

  # A mark for scripts/ci-changes.py and nothing else: this commit passed on a Mac that had built it from nothing. Where work is integrated
  # only such a pass spares the next run its Mac.
  macos-from-nothing:
    needs: [changes, macos]
    # Not for a draft that asked for a Mac: nobody has checked there that every test ran somewhere.
    if: ${{ needs.macos.result == 'success' && needs.changes.outputs.build != 'upon' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "::notice title=macos::passed, built from nothing"

  # The net under the selection: every test the Mac's build contains has run, there or on Linux. Its summary says what ran where.
  tests-accounted-for:
    needs: [changes, linux, macos]
    # Not for a draft that asked for a Mac: Linux ran lint alone there and left no record to hold the Mac's against.
    if: ${{ !cancelled() && needs.macos.result != 'skipped' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tests-*
          merge-multiple: true
      - name: Has every test run somewhere?
        env:
          MODE: ${{ needs.changes.outputs.tests == 'mac-only' && 'mac-only' || 'full' }}
          WHY: ${{ needs.changes.outputs.why }}
        run: ./scripts/ci-tests.py account --mac mac.tsv --mac-all mac-all.txt --linux linux.tsv --mode "$MODE" --why "$WHY"

  # The headless stack, on Linux, in every run: .github/workflows/linux.yml. `needs: linux` waits for all of it.
  # Of a pull request that is still a draft only lint: linux.yml says why. The checks of that run stay with the commit, as skipped,
  # beside those of the run that marking it ready starts. So whoever asks whether a commit passed asks for `linux / verdict`,
  # the newest of that name, and not whether all that is called linux succeeded.
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      all: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

  # What is compiled for a part of the tests is not the checkout, and a process to a file is not how `swift test` runs them
  # (linux.yml). So where work is integrated (a push to main, a merge train, a pull request into main from whatever branch), and at
  # night, plain `swift test` runs everything once more and must come to the same outcome, test by test. Nobody else has
  # to wait twelve minutes for it: whoever integrates waits for this one too. It starts at once, beside the parts: by
  # the time it has run, their record is there, or they failed and so does this.
  tests-whole:
    # Not for a draft: there are no parts there to hold it against.
    if: ${{ github.event_name != 'pull_request' || (github.base_ref == 'main' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Python and make for the scripts, and a git that trusts the checkout
        # The checkout belongs to the runner's user and the container runs as root, which git refuses to work with.
        run: |
          apt-get update -qq && apt-get install -y -qq python3 make
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: ./scripts/ci-step.py toolchain swift --version
      - name: Test
        run: ./scripts/ci-step.py --summary 'Test run with' test swift test --event-stream-output-path whole.jsonl --event-stream-version 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tests-linux
      - name: Whole and in parts, the same tests came out the same
        run: ./scripts/ci-step.py same ./scripts/fast-tests.py same whole.jsonl linux.tsv

  # The oldest Swift that README.md and docs/INSTALL.md promise: what Xcode 26.0 to 26.3 come with. What it refuses and
  # the newest takes (a name it looks up otherwise, an expression it gives up on) it refuses here, without a Mac: the
  # headless stack and every test are compiled, and all the macOS-only code is type-checked against the stand-ins. The
  # tests are not run: linux.yml and `macos` do that. A pull request that changes only what Linux builds gets no Mac, so without
  # this it could land what the Mac job's compiler refuses, and the next to get a Mac would pay. It takes eleven minutes, more
  # than twice what the Linux verdict takes, so it is no part of that: a check of its own, which whoever lands reads by its name.
  # RED HERE STOPS A LANDING as a red verdict does. What it catches is easy to write (`let x = … { x(…) }`), so it will fire.
  oldest-swift:
    # Not for a draft, like all but lint.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Python and make for the scripts, and a git that trusts the checkout
        # The checkout belongs to the runner's user and the container runs as root, which git refuses to work with.
        run: |
          apt-get update -qq && apt-get install -y -qq python3 make
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolchain
        run: ./scripts/ci-step.py toolchain swift --version
      - name: How to see it at home
        run: echo '::notice title=at home::docker run --rm -v "$PWD":/w -w /w swift:6.2-noble swift build --build-tests'
      - name: Build, tests included
        run: ./scripts/ci-step.py --summary 'warning:|Build complete' build swift build --build-tests
      - name: Type-check the macOS-only code against stand-ins
        env:
          ALL: 1
        run: ./scripts/ci-step.py --summary 'error:|type-check' typecheck-mac make typecheck-mac

  # The same promise, kept on a Mac, at both of its ends: the oldest Xcode it names and the newest Swift there is
  # compile everything, tests included, with Apple's own frameworks. It matters: Swift 6.3 crashed on code that 6.4
  # took, and only with the real SwiftUI, where neither Linux job could see it. Only where work is integrated, as
  # scripts/ci-changes.py has it (pushes to main, every pull request into main, the one from the trunk), and at night: a few
  # minutes of two Macs for each merge train, not for each pull request.
  macos-other-swifts:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mac != 'false' && (github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'swarm/trunk') }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        swift: [oldest, newest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The oldest Xcode Arbor promises to build with
        if: matrix.swift == 'oldest'
        run: |
          xcode=$(ls -d /Applications/Xcode_26.0*.app | sort -V | head -1)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 26.0 any more. Run this job where there is one, or raise what README.md and docs/INSTALL.md promise."
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: The newest Xcode on the runner, and the newest Swift
        if: matrix.swift == 'newest'
        uses: ./.github/actions/mac-setup
        with:
          swift: "6.4"
      - name: Toolchain
        run: ./scripts/ci-step.py toolchain swift --version
      - name: Build, tests included
        run: ./scripts/ci-step.py --summary 'warning:|Build complete' build swift build --build-tests
